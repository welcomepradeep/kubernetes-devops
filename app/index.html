<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kubernetes DevOps Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>Kubernetes DevOps Platform</h1>

    <p class="subtitle">
        End-to-End Cloud Native CI/CD Platform
    </p>

    <div class="technologies">

        <div class="card">
            <h2>GitHub</h2>
            <p>Source Control</p>
        </div>

        <div class="card">
            <h2>Jenkins</h2>
            <p>CI/CD Automation</p>
        </div>

        <div class="card">
            <h2>Docker</h2>
            <p>Containerization</p>
        </div>

        <div class="card">
            <h2>Kubernetes</h2>
            <p>Container Orchestration</p>
        </div>

        <div class="card">
            <h2>Helm</h2>
            <p>Application Packaging</p>
        </div>

        <div class="card">
            <h2>Prometheus</h2>
            <p>Monitoring</p>
        </div>

        <div class="card">
            <h2>Grafana</h2>
            <p>Visualization</p>
        </div>

        <div class="card">
            <h2>AWS</h2>
            <p>Cloud Infrastructure</p>
        </div>

    </div>

    <button onclick="showMessage()">
        Deployment Status
    </button>

    <p id="status"></p>

</div>

<script src="js/script.js"></script>

</body>
</html>
