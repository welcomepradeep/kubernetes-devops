apiVersion: apps/v1
kind: Deployment

metadata:

  name: {{ .Release.Name }}

  namespace: devops

spec:

  replicas: {{ .Values.replicaCount }}

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

      maxSurge: 1

  selector:

    matchLabels:

      app: {{ .Release.Name }}

  template:

    metadata:

      labels:

        app: {{ .Release.Name }}

    spec:

      containers:

        - name: web

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:

            - containerPort: 80

          resources: {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 10

            periodSeconds: 20
