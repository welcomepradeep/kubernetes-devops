---
############################################################
# Disable Swap
############################################################

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  become: true
  changed_when: false

- name: Remove swap entries from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*([^#].*\sswap\s+.*)$'
    replace: '# \1'
  become: true

############################################################
# Kernel Modules
############################################################

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present
  become: true

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present
  become: true

############################################################
# Persistent Kernel Modules
############################################################

- name: Configure Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      overlay
      br_netfilter
  become: true

############################################################
# Kubernetes Sysctl Settings
############################################################

- name: Configure Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  become: true

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  changed_when: false

############################################################
# Required Packages
############################################################

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - tar
      - socat
      - conntrack
      - iproute-tc
      - iptables
      - ca-certificates
    state: present
  become: true
