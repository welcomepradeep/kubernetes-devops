---
############################################################
# Disable Swap
############################################################

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*([^#].*\s+swap\s+.*)$'
    replace: '# \1'

############################################################
# Kernel Modules
############################################################

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

############################################################
# Persist Kernel Modules
############################################################

- name: Configure Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      overlay
      br_netfilter

############################################################
# Kubernetes Sysctl Settings
############################################################

- name: Configure Kubernetes sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Reload sysctl configuration
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

############################################################
# Required Packages
############################################################

- name: Install required OS packages
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - tar
      - socat
      - conntrack-tools
      - iproute-tc
      - ebtables
    state: present
