[control_plane]
control-plane ansible_host=CONTROL_PLANE_PUBLIC_IP

[workers]
worker1 ansible_host=WORKER01_PUBLIC_IP
worker2 ansible_host=WORKER02_PUBLIC_IP

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/k8s-lab-key.pem
ansible_python_interpreter=/usr/bin/python3
